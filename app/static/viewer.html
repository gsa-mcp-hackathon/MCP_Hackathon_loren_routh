      raw[MAINTENANCE_KEY] = [makeEntry(template, "Maintenance Cost", d.maintenance)];
      if (COST_KEY in raw) delete raw[COST_KEY];

      // Nameplate: overwrite Manufacturer/Model in place (add if missing),
      // and add Serial Number (Revit has no native serial row).
      raw[MANUFACTURER_KEY] = [makeEntry(template, "Manufacturer", d.manufacturer)];
      raw[MODEL_KEY] = [makeEntry(template, "Model", d.model)];
      raw[SERIAL_KEY] = [makeEntry(template, "Serial Number", d.serial)];
    }

    const UNAVAILABLE_DETAILS = {
      replacement: "unavailable",
      maintenance: "unavailable",
      manufacturer: "unavailable",
      model: "unavailable",
      serial: "unavailable",
    };

    // Wrap the property DB's getPropertySet — the method the panel actually reads
    // from (confirmed live: model.getPropertySetAsync delegates to it). The
    // Maximo lookup is async, so we PREFETCH on selection (below) into
    // maximoCache and read it synchronously here.
    function installMaximoCostOverride(model) {
      if (!model || model.__maximoWrapped) return;
      const pdb = model.getPropertyDb && model.getPropertyDb();
      if (!pdb || typeof pdb.getPropertySet !== "function") {
        console.warn("Maximo override: property DB getPropertySet unavailable");
        return;
      }
      const original = pdb.getPropertySet.bind(pdb);
      pdb.getPropertySet = function (dbIds, options, onSuccess, onError) {
        return original(
          dbIds,
          options,
          (raw) => {
            try {
              const id = Array.isArray(dbIds) ? dbIds[0] : dbIds;
              const ext = dbIdToExternalId[id];
              const d = (ext && maximoCache.get(ext)) || UNAVAILABLE_DETAILS;
              applyMaximoToRaw(raw, d);
            } catch (e) {
              console.warn("maximo override error", e);
            }
            onSuccess(raw);
          },
          onError
        );
      };
      model.__maximoWrapped = true;
      console.log("Maximo override installed (propertyDb.getPropertySet)");
    }

    // On selection, prefetch the element's Maximo details and refresh the panel
    // so the first click shows live values (the panel's getPropertySet is sync).
    function installMaximoSelectionPrefetch() {
      if (!viewer) return;
      viewer.addEventListener(
        Autodesk.Viewing.SELECTION_CHANGED_EVENT,
        async (ev) => {
          const dbIds = (ev && ev.dbIdArray) || [];
          if (!dbIds.length) return;
          const ext = dbIdToExternalId[dbIds[0]];
          if (!ext || maximoCache.has(ext)) return;
          await fetchMaximoDetails(ext); // populates the cache
          // Re-request properties so the panel re-renders with the cached value.
          try {
            if (viewer.getPropertyPanel) {
              const panel = viewer.getPropertyPanel(true);
              if (panel && panel.isVisible && panel.isVisible()) {
                panel.requestNodeProperties(dbIds[0]);
              }
            }
          } catch (e) {
            /* panel may not be open; cache is warm for next render */
          }
        }
      );
    }

    // ---------------------------------------------------------------- startup

    async function startViewer() {
      setStatus("Initializing APS Viewer…");

      // Reflect the active model source in the persistent badge immediately,
      // before the first byte is requested.
      const sourceBadge = document.getElementById("model-source");
      if (sourceBadge) {
        sourceBadge.textContent =
          "Model source: " +
          (MODEL_SOURCE_LABELS[MODEL_SOURCE] || MODEL_SOURCE);
      }

      const options = {
        env: "Local",
        useADP: false
      };

      Autodesk.Viewing.Initializer(options, async () => {
        const container = document.getElementById("viewer");
        viewer = new Autodesk.Viewing.GuiViewer3D(container);

        const startCode = viewer.start();
        if (startCode !== 0) {
          setStatus("APS Viewer failed to start. Code: " + startCode);
          return;
        }

        try {
          setStatus("Loading MECH model…");
          primaryModel = await loadModel(MODEL_DEFINITIONS[0]);

          setStatus("Indexing model elements…");
          await buildExternalIdMap(primaryModel);

          setStatus("Mapping levels…");
          await loadLevelData();
          await buildLevelMap(primaryModel);
          initLevelsMenu();

          viewer.fitToView();
          captureHomeView();
          setStatus(
            "MECH loaded. Ask the agent a question in the chat window.",
            true
          );

          // Double-click to zoom to an element (single click keeps APS default).
          viewer.container.addEventListener("dblclick", onViewerClick);

          // Role B: open the command channel once the model is ready so any
          // broadcast highlight can resolve externalIds to dbIds immediately.
          connectCommandSocket();

          // Replace the hollow Revit Cost with Maximo cost at the data layer.
          installMaximoCostOverride(primaryModel);
          installMaximoSelectionPrefetch();
        } catch (error) {
          console.error(error);
          setStatus(error.message);
        }
      });
    }

    document
      .getElementById("toggle-mech")
      .addEventListener("click", () => toggleModel("MECH"));

    document
      .getElementById("fit-models")
      .addEventListener("click", () => {
        if (viewer) {
          viewer.fitToView();
        }
      });

    document
      .getElementById("reset-view")
      .addEventListener("click", () => {
        if (viewer) {
          clearHighlight();
          focusedKey = null;
          viewer.fitToView();
          setStatus("Highlight cleared.");
        }
      });

    document
      .getElementById("chat-send")
      .addEventListener("click", sendChat);

    document
      .getElementById("chat-input")
      .addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendChat();
        }
      });

    window.addEventListener("load", startViewer);
  </script>
</body>
</html>
